name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck + Lint + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  scope-check:
    name: Multi-tenant scope drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Solo corre si los secrets están disponibles (push directo a main o PR
    # desde una rama del mismo repo). En fork PRs los secrets están bloqueados
    # por design → skip el job para no fallar el PR sin razón.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify scope.ts matches live schema
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/check-tenant-scope.ts

  integration-tests:
    name: Integration tests (real Supabase test project)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Solo corre si los TEST_* secrets existen (igual que scope-check).
    # Fork PRs no acceden a estos secrets — skip.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests against rentalflow-tests Supabase project
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:integration

  bundle-secret-scan:
    name: Bundle leak scan (client bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Build needs Supabase + Stripe public keys to compile some pages, but
    # the scan output itself is independent of those values — it only looks
    # for high-entropy strings that LOOK like real secrets. Use TEST_*
    # secrets for the build env. Fork PRs without those secrets are skipped.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Production build (target for scan)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          # Stripe publishable key is intentionally public — placeholder is fine.
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_PLACEHOLDER_for_build_only
          STRIPE_SECRET_KEY: ${{ secrets.TEST_STRIPE_SECRET_KEY }}
        run: npm run build

      - name: Scan client bundle for leaked secrets
        run: npx tsx scripts/scan-bundle-for-secrets.ts

  e2e-tests:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same fork-PR exclusion as the other secret-dependent jobs.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check E2E secrets are configured
        # We need the anon key + service role + URL on the Supabase side AND
        # the Stripe secrets to spin up the dev server in webServer block.
        # When any are missing (early days, fork PRs) emit a warning and let
        # subsequent steps skip cleanly instead of failing the whole CI run.
        id: check_secrets
        env:
          ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SR_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          URL: ${{ secrets.TEST_SUPABASE_URL }}
          STRIPE_KEY: ${{ secrets.TEST_STRIPE_SECRET_KEY }}
          STRIPE_WH: ${{ secrets.TEST_STRIPE_WEBHOOK_SECRET }}
        run: |
          missing=""
          [ -z "$ANON_KEY" ] && missing="$missing TEST_SUPABASE_ANON_KEY"
          [ -z "$SR_KEY" ] && missing="$missing TEST_SUPABASE_SERVICE_ROLE_KEY"
          [ -z "$URL" ] && missing="$missing TEST_SUPABASE_URL"
          [ -z "$STRIPE_KEY" ] && missing="$missing TEST_STRIPE_SECRET_KEY"
          [ -z "$STRIPE_WH" ] && missing="$missing TEST_STRIPE_WEBHOOK_SECRET"
          if [ -n "$missing" ]; then
            echo "::warning::E2E secrets missing —$missing — skipping E2E job. Add them in repo Settings → Secrets to enable."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Playwright browsers
        if: steps.check_secrets.outputs.skip != 'true'
        # Only Chromium — see playwright.config.ts projects[]. ~30s with cache.
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        if: steps.check_secrets.outputs.skip != 'true'
        env:
          CI: "1"
          # Playwright config's webServer.env will pick these up to point the
          # dev server at the test Supabase + test Stripe.
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_STRIPE_SECRET_KEY: ${{ secrets.TEST_STRIPE_SECRET_KEY }}
          TEST_STRIPE_WEBHOOK_SECRET: ${{ secrets.TEST_STRIPE_WEBHOOK_SECRET }}
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure() && steps.check_secrets.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
