<line x1="90" y1="220" x2="590" y2="220" stroke="#eeeeee" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:rgb(238, 238, 238);color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
