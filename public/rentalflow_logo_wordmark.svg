<svg width="100%" viewBox="0 0 690 370" role="img" xmlns="http://www.w3.org/2000/svg" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">RentalFlow logo wordmark</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Minimalist SaaS logo combining a custom wordmark with an abstract icon of an arrow morphing into a calendar dot, in navy blue and gold.</desc>

<defs>

<mask id="imagine-text-gaps-do0e9t" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="690" height="370" fill="white"/><rect x="-4" y="-8" width="190.046875" height="73" fill="black" rx="2"/><rect x="204" y="-8" width="150.249755859375" height="73" fill="black" rx="2"/><rect x="108" y="66" width="204.90625" height="16" fill="black" rx="2"/><rect x="86" y="228" width="399.40625" height="16" fill="black" rx="2"/></mask></defs>

<!-- White background canvas -->
<rect x="0" y="0" width="680" height="360" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

